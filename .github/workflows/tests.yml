name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: System libraries for OpenCV / MediaPipe
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0 libportaudio2 libegl1 libgles2
      - name: Python packages
        run: |
          pip install -r requirements-dev.txt
          pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Face model
        run: python -m pulsecheck download-model
      - name: Tests
        run: python -m pytest -q
